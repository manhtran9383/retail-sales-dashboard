name: Retail Sales Dashboard CI

# Trust note: only github.workspace and the static matrix.dataset (defined in
# this file) are interpolated. No untrusted event input reaches a run: command.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify pipeline (${{ matrix.dataset }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        dataset: [retail]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pip install ruff

      - name: Run pipeline (module mode)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.run_retail_analysis --dataset ${{ matrix.dataset }}

      - name: Run pytest
        run: python -m pytest tests -q --cov=src --cov-report=term-missing --cov-fail-under=40

      - name: Lint with ruff
        run: ruff check src tests

  preview:
    name: Preview + Power BI pack (${{ matrix.dataset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset: [retail]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pip install ruff

      - name: Build Power BI data pack
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.run_retail_analysis --dataset ${{ matrix.dataset }} --stage powerbi

      - name: Build preview HTML
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.run_retail_analysis --dataset ${{ matrix.dataset }} --stage preview

      - name: Assert preview has 6 embedded figures
        run: |
          n=$(grep -o 'data:image/png;base64' dashboard_preview.html | wc -l)
          echo "embedded PNG figures: $n"
          if [ "$n" -lt 6 ]; then echo "preview has only $n embedded figures (expected >= 6)"; exit 1; fi

      - name: Assert Power BI pack present
        run: |
          pack="powerbi/data/retail"
          for f in dim_product.csv dim_country.csv dim_date.csv fact_sales.csv kpi_monthly_revenue.csv kpi_top_products.csv kpi_survival.csv kpi_targeting_lift.csv; do
            if [ ! -f "$pack/$f" ]; then echo "missing $pack/$f"; exit 1; fi
          done
          echo "powerbi pack OK"

      - name: Lint with ruff
        run: ruff check src tests
