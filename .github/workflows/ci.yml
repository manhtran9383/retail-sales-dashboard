name: Retail Sales Dashboard CI

# Trust note: only github.workspace and the static matrix.dataset (defined in
# this file) are interpolated. No untrusted event input reaches a run: command.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify pipeline (${{ matrix.dataset }})
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        dataset: [retail]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pipeline (module mode)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.run_retail_analysis --dataset ${{ matrix.dataset }}

      - name: Run pytest
        run: python -m pytest tests -q --cov=src --cov-report=term-missing

  preview:
    name: Preview + Power BI pack (${{ matrix.dataset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dataset: [retail]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Power BI data pack
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.run_retail_analysis --dataset ${{ matrix.dataset }} --stage powerbi

      - name: Build preview HTML
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m src.run_retail_analysis --dataset ${{ matrix.dataset }} --stage preview

      - name: Assert preview has 6 embedded figures
        shell: pwsh
        run: |
          $html = Get-Content -Raw dashboard_preview.html
          $n = ([regex]::Matches($html, 'data:image/png;base64')).Count
          Write-Host "embedded PNG figures: $n"
          if ($n -lt 6) { Write-Error "preview has only $n embedded figures (expected >= 6)"; exit 1 }

      - name: Assert Power BI pack present
        shell: pwsh
        run: |
          $pack = "powerbi/data/${{ matrix.dataset }}"
          foreach ($f in @('dim_product.csv','dim_country.csv','dim_date.csv','fact_sales.csv','kpi_monthly_revenue.csv','kpi_top_products.csv','kpi_survival.csv','kpi_targeting_lift.csv')) {
            if (-not (Test-Path "$pack/$f")) { Write-Error "missing $pack/$f"; exit 1 }
          }
          Write-Host "powerbi pack OK"

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retail-outputs-${{ github.run_id }}
          path: |
            reports/figures/
            reports/Re_Sales_Analysis.xlsx
            powerbi/data/retail/
            dashboard_preview.html
